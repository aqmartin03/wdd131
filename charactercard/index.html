<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Card</title>
    <link href="charactercard.css" rel="stylesheet">
    <script defer src="charactercard.js"></script>
</head>
<body>
    <div class="card">
        <img class="image">
        <h2 class="name"></h2>
        <div class="stats">
            <p id="class"></p>
            <p id="level"></p>
            <p id="health"></p>
        </div>
        <div class="buttons">
            <button id="attackSelect">Attacked</button>
            <button id="levelUpSelect">Level Up</button>
        </div>
    </div>
</body>
</html>
